<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages 404 handler for clean URLs
    // Redirects /register to register.html, /journal to index.html, etc.
    
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    
    // Remove leading slash
    path = path.replace(/^\//, '');
    
    // Map paths to HTML files
    var routes = {
      'register': 'register.html',
      'journal': 'index.html',
      '': 'index.html'
    };
    
    // Get the target file
    var targetFile = routes[path] || 'index.html';
    
    // Redirect to the target file with query string and hash
    window.location.href = targetFile + search + hash;
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
